# Family photo stack.
#
# Immich server, machine learning, Valkey, and Postgres are the upstream
# v3.3.5 Compose file, pinned and adjusted for a Fedora host that runs rootful
# Docker with SELinux enforcing:
#   https://github.com/immich-app/immich/releases/download/v3.3.5/docker-compose.yml
#
# :Z on a bind mount gives that container a private label. Do not put
# :Z on /etc/localtime (that relabels the host clock file). The iCloud
# download is shared by the downloader and Immich, so those mounts use :z.
#
# Host ports 80, 3000, 3001, and 8080 are already taken by the family portal,
# AdGuard Home, Number Knockout, and the Minecraft manager. Immich defaults to
# 2283 and the timeline to 2284. Both are set in .env.

name: family-photos

services:
  immich-server:
    container_name: family_photos_immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v3.3.5}
    # CPU transcoding is the default. For Quick Sync, VAAPI, or NVENC, download
    # hwaccel.transcoding.yml from the same Immich tag and uncomment:
    # extends:
    #   file: hwaccel.transcoding.yml
    #   service: cpu
    volumes:
      - ${UPLOAD_LOCATION:-./data/library}:/data:Z
      - ${EXTERNAL_LIBRARY_1:-./external/library1}:/mnt/media/library1:ro,Z
      - ${EXTERNAL_LIBRARY_2:-./external/library2}:/mnt/media/library2:ro,Z
      - ${EXTERNAL_LIBRARY_3:-./external/library3}:/mnt/media/library3:ro,Z
      # Shared with icloudpd. :z, not :Z, so both containers can use the tree.
      - ${ICLOUD_DOWNLOAD_LOCATION:-./data/icloud}:/mnt/media/icloud:ro,z
      # No :Z here. A private label on this file breaks the host timezone.
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      - "${IMMICH_BIND:-0.0.0.0}:${IMMICH_PORT:-2283}:2283"
    depends_on:
      - redis
      - database
    restart: unless-stopped
    # The image healthcheck hits /api/server/ping. The first boot imports
    # geodata before that answers, so give it a long start period. A success
    # during the start period still counts as healthy immediately.
    healthcheck:
      test: ["CMD", "immich-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 15m

  immich-machine-learning:
    container_name: family_photos_immich_ml
    # CPU build. For a GPU or NPU, change the tag suffix and the extends
    # service together, for example ${IMMICH_VERSION:-v3.3.5}-openvino
    # and service: openvino. Model names: armnn, cuda, rocm, openvino, rknn.
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-v3.3.5}
    # extends:
    #   file: hwaccel.ml.yml
    #   service: cpu
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      disable: false

  redis:
    container_name: family_photos_redis
    image: docker.io/valkey/valkey:9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    restart: unless-stopped

  database:
    container_name: family_photos_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      # DB_STORAGE_TYPE: "HDD"
    volumes:
      - ${DB_DATA_LOCATION:-./data/postgres}:/var/lib/postgresql/data:Z
    shm_size: 128mb
    restart: unless-stopped
    healthcheck:
      disable: false

  timeline:
    container_name: family_photos_timeline
    build: ./timeline
    image: family-photos-timeline:local
    environment:
      IMMICH_URL: http://immich-server:2283
      IMMICH_API_KEY: ${IMMICH_API_KEY:-}
      IMMICH_PUBLIC_URL: ${IMMICH_PUBLIC_URL:-http://192.168.1.3:2283}
      TIMELINE_BASIC_AUTH_USER: ${TIMELINE_BASIC_AUTH_USER:-}
      TIMELINE_BASIC_AUTH_PASSWORD: ${TIMELINE_BASIC_AUTH_PASSWORD:-}
      TIMELINE_PAGE_SIZE: ${TIMELINE_PAGE_SIZE:-48}
      TZ: ${TZ:-America/Chicago}
    ports:
      - "${TIMELINE_BIND:-0.0.0.0}:${TIMELINE_PORT:-2284}:8080"
    depends_on:
      immich-server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Interactive one-shot used by ./import-icloud.sh. Not started by setup.sh.
  icloud:
    profiles: ["icloud"]
    image: icloudpd/icloudpd:1.32.3
    stdin_open: true
    tty: true
    environment:
      TZ: ${TZ:-America/Chicago}
    volumes:
      - ${ICLOUD_DOWNLOAD_LOCATION:-./data/icloud}:/data:z
      - ${ICLOUD_COOKIE_LOCATION:-./data/icloud-session}:/cookies:z
    entrypoint: ["/app/entrypoint.sh"]
    command: ["icloudpd", "--help"]
    restart: "no"

  # Started by ./import-icloud.sh after the first successful sign-in.
  # Restart policy brings it back after a reboot. An expired Apple session
  # stays up and goes unhealthy instead of crash-looping.
  icloud-sync:
    profiles: ["icloud"]
    build:
      context: .
      dockerfile: icloud/Dockerfile
    image: family-photos-icloud-sync:local
    container_name: family_photos_icloud_sync
    environment:
      TZ: ${TZ:-America/Chicago}
      ICLOUD_USERNAME: ${ICLOUD_USERNAME:-}
      IMMICH_URL: http://immich-server:2283
      IMMICH_API_KEY: ${IMMICH_API_KEY:-}
      ICLOUD_IMPORT_PATH: /mnt/media/icloud
      ICLOUD_LIBRARY_NAME: iCloud
      ICLOUD_SYNC_INTERVAL: ${ICLOUD_SYNC_INTERVAL:-3600}
      ICLOUD_UNTIL_FOUND: ${ICLOUD_UNTIL_FOUND:-10}
    volumes:
      - ${ICLOUD_DOWNLOAD_LOCATION:-./data/icloud}:/data:z
      - ${ICLOUD_COOKIE_LOCATION:-./data/icloud-session}:/cookies:z
    depends_on:
      immich-server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import os,sys; sys.exit(0 if os.path.exists('/tmp/sync-state/healthy') and not os.path.exists('/tmp/sync-state/needs-reauth') else 1)",
        ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20m

volumes:
  model-cache:
