<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark">
  <title>Family Photos</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/timeline.css?v={{ asset_version }}">
</head>
<body>
  <header>
    <div class="brand">
      <p class="eyebrow">Family library</p>
      <h1>Photos</h1>
      <div id="focus" class="focus" role="group" aria-label="Which photos to show">
        <button type="button" data-focus="people" aria-pressed="true">With people</button>
        <button type="button" data-focus="all" aria-pressed="false">All photos</button>
      </div>
    </div>
    <button type="button" id="filter-toggle" aria-expanded="false" aria-controls="filters">Filters</button>
    <form id="filters">
      <div class="words">
        <label for="q">Words</label>
        <input id="q" type="search" placeholder="beach, birthday cake, snow" autocomplete="off" enterkeyhint="search">
      </div>
      <div>
        <label for="city">City</label>
        <select id="city"></select>
      </div>
      <div>
        <label for="state">State</label>
        <select id="state"></select>
      </div>
      <div>
        <label for="country">Country</label>
        <select id="country"></select>
      </div>
      <div>
        <label for="start">From</label>
        <input id="start" type="date">
      </div>
      <div>
        <label for="end">To</label>
        <input id="end" type="date">
      </div>
      <div class="actions">
        <button type="submit">Show</button>
        <button type="button" id="clear">Clear</button>
      </div>
      <div class="people-row">
        <label for="person-filter">People</label>
        <input id="person-filter" type="search" placeholder="Find a person" autocomplete="off">
        <div id="people" class="people"></div>
        <p id="unnamed" class="hint"></p>
      </div>
    </form>
    <p id="banner" class="banner" hidden></p>
  </header>

  <div id="stage">
    <div id="scroller" tabindex="0" aria-label="Photo timeline">
      <div id="strip"></div>
    </div>
    <p id="empty" class="empty" hidden>No photos in this window.</p>
  </div>

  <footer>
    <div class="scrub-row">
      <label class="scrub-label" for="scrub">Date</label>
      <input id="scrub" type="range" min="0" max="0" value="0" disabled aria-valuetext="No photos yet">
      <output id="scrub-readout" for="scrub">Loading</output>
    </div>
    <div class="jump-row">
      <label for="jump-date">Jump</label>
      <input id="jump-date" type="date">
      <button type="button" id="jump">Go</button>
      <p class="hint">Opens on the newest match. Drag the line or jump to land on another day.</p>
    </div>
  </footer>

  <dialog id="lightbox" aria-label="Photo">
    <div class="lightbox-frame">
      <button type="button" id="lightbox-close">Close</button>
      <button type="button" id="lightbox-prev" aria-label="Previous photo">Prev</button>
      <img id="lightbox-img" alt="">
      <button type="button" id="lightbox-next" aria-label="Next photo">Next</button>
      <div id="lightbox-meta" class="lightbox-meta"></div>
      <a id="lightbox-link" href="" target="_blank" rel="noopener noreferrer">Open in Immich</a>
    </div>
  </dialog>

  <script id="boot" type="application/json">{{ boot | tojson }}</script>
  <script src="/static/timeline.js?v={{ asset_version }}"></script>
  <noscript><p class="banner">This timeline needs JavaScript to scroll through the photos.</p></noscript>
</body>
</html>
