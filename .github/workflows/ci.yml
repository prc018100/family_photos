name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the timeline service
        working-directory: timeline
        run: pip install -e ".[dev]"
      - name: Test timeline
        working-directory: timeline
        run: pytest -q
      - name: Test iCloud import helper
        run: python -m pytest -q scripts/tests
      - name: Test shell helpers
        run: bash scripts/tests/test_password.sh && bash -n setup.sh && bash -n import-icloud.sh && bash -n add-sync-libraries.sh && bash -n icloud/sync.sh && bash -n scripts/lib.sh

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: |
          cp .env.example .env
          docker compose config >/dev/null
          docker compose --profile icloud config >/dev/null
